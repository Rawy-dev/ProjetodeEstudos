<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato | Caderno de Estudos</title>
    <link rel="stylesheet" href="src/style.css" />
    <style>
      body {
        margin: 0;
      }
      .simple-page {
        width: min(960px, calc(100% - 30px));
        margin: 26px auto 40px;
      }
      .simple-card {
        background: rgba(255,255,255,0.45);
        border: 1px solid rgba(100,117,124,0.15);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 12px 24px rgba(53,63,70,0.04);
      }
      .simple-page h1 {
        margin: 0 0 10px;
        font-size: clamp(2.1rem, 4vw, 3.5rem);
        letter-spacing: -0.06em;
        color: #2d3942;
      }
      .simple-page p {
        color: #5e6c73;
        line-height: 1.7;
      }
      form {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }
      input, textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(112,129,138,0.2);
        background: rgba(255,255,255,0.34);
        font: inherit;
      }
      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2b7689, #205d73);
        color: white;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="page-shell simple-page">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">C</div>
          <div class="brand-text">
            <span class="brand-name">Caderno</span>
            <span class="brand-tag">estudos</span>
          </div>
        </div>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="index.html">Início</a>
          <a href="disciplinas.html">Disciplinas</a>
          <a href="conteudos.html">Conteúdos</a>
          <a href="cronograma.html">Cronograma</a>
          <a href="dicas.html">Dicas</a>
          <a href="contato.html">Contato</a>
        </nav>
      </header>

      <main class="simple-card">
        <p class="eyebrow">CONTATO</p>
        <h1>Entre em contato</h1>
        <p>Se quiser sugerir novas matérias, melhorias ou compartilhar uma boa ideia para o caderno, escreva abaixo.</p>

        <form>
          <input type="text" placeholder="Seu nome" aria-label="Seu nome" />
          <input type="email" placeholder="Seu e-mail" aria-label="Seu e-mail" />
          <textarea rows="5" placeholder="Sua mensagem" aria-label="Sua mensagem"></textarea>
          <button type="submit">Enviar</button>
        </form>
      </main>
    </div>
  </body>
</html>
